# mTLS (Mutual TLS) Configuration
# Cloudflare Administrator

# SSL/TLS Certificate Configuration
ssl_certificate = /etc/ssl/certs/client.crt
ssl_certificate_key = /etc/ssl/private/client.key
ssl_trusted_ca = /etc/ssl/certs/ca.crt

# mTLS Settings
mtls_enabled = true
require_client_certificate = true
verify_client_certificate = true

# Certificate Validation
certificate_validation_depth = 2
certificate_revocation_check = crl
certificate_ocsp_stapling = true

# TLS Protocol Configuration
tls_version_min = 1.2
tls_version_max = 1.3
tls_cipher_suites = HIGH:!aNULL:!MD5

# Session Configuration
session_timeout = 3600
session_cache_size = 50M
session_cache_timeout = 300

# Logging
log_level = info
log_file = /var/log/mtls.log
audit_logging = true

# Performance
connection_timeout = 30
keepalive_timeout = 65
max_connections = 1000
